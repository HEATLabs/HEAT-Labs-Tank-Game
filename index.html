<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Main meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Page title displayed in the browser tab -->
    <title>Tank Defense - HEAT Labs</title>
    <!-- Main stylesheets -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/game/tank-defense.css">
    <link rel="stylesheet" href="assets/css/libraries/tailwind.css">
    <link rel="stylesheet" href="assets/css/libraries/font-awesome/all.css">
    <link rel="stylesheet" href="assets/css/modules/external-link.css">
    <link rel="stylesheet" href="assets/css/modules/no-scrollbar.css">
  </head>
  <body>
    <!-- Main Content -->
    <div class="content-wrapper">
      <!-- Main Content -->
      <section id="main" class="section">
        <div class="container mx-auto px-4">
          <!-- Game Section -->
          <section class="tank-game-section">
            <div class="tank-game-container">
              <!-- Game Canvas -->
              <div class="tank-game-canvas-container">
                <!-- Start Overlay -->
                <div id="startOverlay" class="game-overlay" style="display: flex;">
                  <h2>Tank Defense</h2>
                  <p>Survive waves of enemy tanks. Defend your position and score as high as possible!</p>
                  <button id="startGameFromOverlay" class="tank-game-btn" style="font-size: 1.25rem; padding: 1rem 2rem;">
                    <i class="fas fa-play"></i> Start Game </button>
                </div>
                <!-- Game Over Overlay -->
                <div id="gameOverOverlay" class="game-overlay" style="display: none;">
                  <h2>Game Over</h2>
                  <div class="overlay-stats">
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="finalScore">0</div>
                      <div class="overlay-stat-label">Final Score</div>
                    </div>
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="finalWave">1</div>
                      <div class="overlay-stat-label">Wave Reached</div>
                    </div>
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="enemiesKilled">0</div>
                      <div class="overlay-stat-label">Enemies Killed</div>
                    </div>
                  </div>
                  <button id="restartFromOverlay" class="tank-game-btn" style="font-size: 1.25rem; padding: 1rem 2rem;">
                    <i class="fas fa-redo"></i> Play Again </button>
                </div>
                <canvas id="tankGameCanvas"></canvas>
                <div class="tank-debug-panel" id="debugPanel"></div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </div>
    <script src="assets/js/game/tank-defense.js"></script>
    <script src="assets/js/modules/external-link.js"></script>
    <script src="assets/js/modules/context-menu.js"></script>
  </body>
</html>
