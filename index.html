<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Main meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Page title displayed in the browser tab -->
    <title>Tank Defense - HEAT Labs [DEV]</title>
    <!-- Main stylesheets -->
    <link rel="stylesheet" href="assets/css/libraries/tailwind.css">
    <link rel="stylesheet" href="assets/css/libraries/font-awesome/all.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/game/tank-defense.css">
  </head>
  <body>
    <!-- Main Content -->
    <div class="content-wrapper">
      <!-- Main Content -->
      <section id="main" class="section">
        <div class="container mx-auto px-4">
          <!-- Game Section -->
          <section class="tank-game-section">
            <div class="tank-game-container">
              <!-- Game Header -->
              <div class="tank-game-header">
                <div class="tank-game-title">
                  <i class="fas fa-tank"></i> Tank Defense
                </div>
                <div class="tank-game-stats">
                  <div class="stat-item">
                    <div class="stat-value" id="gameScore">0</div>
                    <div class="stat-label">Score</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" id="gameWave">1</div>
                    <div class="stat-label">Wave</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" id="gameHealth">100</div>
                    <div class="stat-label">Health</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" id="gameEnemies">0</div>
                    <div class="stat-label">Enemies</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" id="totalKills">0</div>
                    <div class="stat-label">Total Kills</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" id="healthPacksCollected">0</div>
                    <div class="stat-label">Health Packs</div>
                  </div>
                </div>
                <div class="tank-game-controls">
                  <button id="fullscreenGame" class="tank-game-btn secondary">
                    <i class="fas fa-expand"></i> Fullscreen </button>
                  <button id="pauseGame" class="tank-game-btn secondary">
                    <i class="fas fa-pause"></i> Pause </button>
                </div>
              </div>
              <!-- Game Canvas -->
              <div class="tank-game-canvas-container">
                <!-- Start Overlay -->
                <div id="startOverlay" class="game-overlay" style="display: flex;">
                  <h2>Tank Defense</h2>
                  <p>Survive waves of enemy tanks. Defend your position and score as high as possible!</p>
                  <button id="startGameFromOverlay" class="tank-game-btn" style="font-size: 1.25rem; padding: 1rem 2rem;">
                    <i class="fas fa-play"></i> Start Game </button>
                </div>
                <!-- Game Over Overlay -->
                <div id="gameOverOverlay" class="game-overlay" style="display: none;">
                  <h2>Game Over</h2>
                  <div class="overlay-stats">
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="finalScore">0</div>
                      <div class="overlay-stat-label">Final Score</div>
                    </div>
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="finalWave">1</div>
                      <div class="overlay-stat-label">Wave Reached</div>
                    </div>
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="enemiesKilled">0</div>
                      <div class="overlay-stat-label">Enemies Killed</div>
                    </div>
                  </div>
                  <button id="restartFromOverlay" class="tank-game-btn" style="font-size: 1.25rem; padding: 1rem 2rem;">
                    <i class="fas fa-redo"></i> Play Again </button>
                </div>
                <canvas id="tankGameCanvas"></canvas>
                <div class="tank-debug-panel" id="debugPanel"></div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </div>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/game/tank-defense.js"></script>
  </body>
</html>
