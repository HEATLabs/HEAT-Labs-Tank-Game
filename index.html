<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Main meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Page title displayed in the browser tab -->
    <title>Tank Defense - HEAT Labs</title>
    <!-- Main stylesheets -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/game/game.css">
    <link rel="stylesheet" href="assets/css/libraries/tailwind.css">
    <link rel="stylesheet" href="assets/css/libraries/font-awesome/all.css">
    <link rel="stylesheet" href="assets/css/modules/external-link.css">
    <link rel="stylesheet" href="assets/css/modules/no-scrollbar.css">
  </head>
  <body>
    <!-- Main Content -->
    <div class="content-wrapper">
      <!-- Main Content -->
      <section id="main" class="section">
        <div class="container mx-auto px-4">
          <!-- Game Section -->
          <section class="tank-game-section">
            <div class="tank-game-container">
              <!-- Game Canvas -->
              <div class="tank-game-canvas-container">
                <!-- Main Menu Overlay -->
                <div id="mainMenuOverlay" class="main-menu-overlay">
                  <h2>TANK DEFENSE</h2>
                  <div class="subtitle">Survive endless waves of enemy tanks.</div>
                  <!-- Main Menu Buttons -->
                  <div class="main-menu-buttons">
                    <button id="continueGameButton" class="tank-game-btn large">
                      <i class="fas fa-play-circle"></i> Continue Game </button>
                    <button id="newGameButton" class="tank-game-btn large">
                      <i class="fas fa-play-circle"></i> New Game </button>
                    <button id="settingsButton" class="tank-game-btn large">
                      <i class="fas fa-cog"></i> Settings </button>
                    <button id="exitButton" class="tank-game-btn secondary large">
                      <i class="fas fa-sign-out-alt"></i> Exit </button>
                  </div>
                  <!-- Version/Copyright Info -->
                  <div class="version-info">
                    <span class="game-title">TANK DEFENSE</span>
                    <span class="version">VERSION 1.0.0</span>
                    <span class="copyright">&copy; 2026 HEAT Labs & SINEWAVE Development</span>
                  </div>
                  <!-- Social Buttons -->
                  <div class="social-buttons-container">
                    <a href="https://discord.gg/yourdiscord" class="social-button" target="_blank" rel="noopener noreferrer">
                      <i class="fab fa-discord"></i>
                    </a>
                    <a href="https://www.instagram.com/heatlabs_official/" class="social-button" target="_blank" rel="noopener noreferrer">
                      <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.youtube.com/@HEATLabs-Official" class="social-button" target="_blank" rel="noopener noreferrer">
                      <i class="fab fa-youtube"></i>
                    </a>
                    <a href="https://x.com/HEAT_Labs" class="social-button" target="_blank" rel="noopener noreferrer">
                      <i class="fab fa-twitter"></i>
                    </a>
                    <a href="https://www.tiktok.com/@heatlabs_official" class="social-button" target="_blank" rel="noopener noreferrer">
                      <i class="fab fa-tiktok"></i>
                    </a>
                    <a href="https://www.twitch.tv/HEATLabs" class="social-button" target="_blank" rel="noopener noreferrer">
                      <i class="fab fa-twitch"></i>
                    </a>
                    <a href="https://heatlabs.net" class="social-button" target="_blank" rel="noopener noreferrer">
                      <i class="fas fa-globe"></i>
                    </a>
                  </div>
                </div>
                <!-- Start Overlay -->
                <div id="startOverlay" class="game-overlay" style="display: none;">
                  <h2>Tank Defense</h2>
                  <p>Survive endless waves of enemy tanks.</p>
                  <button id="startGameFromOverlay" class="tank-game-btn" style="font-size: 1.25rem; padding: 1rem 2rem;">
                    <i class="fas fa-play"></i> Start Game </button>
                </div>
                <!-- Game Over Overlay -->
                <div id="gameOverOverlay" class="game-overlay" style="display: none;">
                  <h2>Game Over</h2>
                  <div class="overlay-stats">
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="finalScore">0</div>
                      <div class="overlay-stat-label">Final Score</div>
                    </div>
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="finalWave">1</div>
                      <div class="overlay-stat-label">Wave Reached</div>
                    </div>
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="enemiesKilled">0</div>
                      <div class="overlay-stat-label">Enemies Killed</div>
                    </div>
                    <div class="overlay-stat">
                      <div class="overlay-stat-value" id="finalSurvivalTime">00:00</div>
                      <div class="overlay-stat-label">Survival Time</div>
                    </div>
                  </div>
                  <div class="button-container">
                    <button id="restartFromOverlay" class="tank-game-btn" style="font-size: 1.25rem; padding: 1rem 2rem;">
                      <i class="fas fa-redo"></i>
                      <span>Play Again</span>
                    </button>
                    <button id="backToMainMenu" class="tank-game-btn secondary" style="margin-top: 1rem;">
                      <i class="fas fa-home"></i>
                      <span>Back to Main Menu</span>
                    </button>
                  </div>
                </div>
                <canvas id="tankGameCanvas"></canvas>
                <div class="tank-debug-panel" id="debugPanel"></div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </div>
    <script src="assets/js/game/game.js"></script>
    <script src="assets/js/modules/external-link.js"></script>
    <script src="assets/js/modules/context-menu.js"></script>
  </body>
</html>
